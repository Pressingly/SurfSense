services:

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: surfsense
      POSTGRES_PASSWORD: surfsense
      POSTGRES_DB: surfsense
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - surfsense_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surfsense"]
      interval: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    volumes:
      - redisdata:/data
    networks:
      - surfsense_local

  backend:
    build:
      context: ./surfsense_backend
      dockerfile: Dockerfile
    env_file:
      - ./surfsense_backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://surfsense:surfsense@db:5432/surfsense
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_APP_URL: redis://redis:6379/0
      NEXT_FRONTEND_URL: http://localhost:3929
    networks:
      - surfsense_local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:

networks:
  surfsense_local:
    driver: bridge
